<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title description">
  <title id="title">From evidence candidates to an inspectable Model Card</title>
  <desc id="description">A four-stage pipeline fixes an exact model target, binds prepared evidence, applies field and relation policy, and emits an inspectable card plus evidence ledger. Source collection, candidate extraction, and semantic claim-support checking remain future work.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#3D7BC8"/>
    </marker>
    <style>
      .ink { fill: #1A1A1A; }
      .muted { fill: #6E6E6E; }
      .blue { fill: #1F4E9C; }
      .carmine { fill: #B2182B; }
      .heading { font-family: Arial, Helvetica, sans-serif; font-size: 31px; font-weight: 700; }
      .chip { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 1px; }
      .stage { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 700; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 18px; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 15px; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: .55px; }
    </style>
  </defs>

  <rect width="1600" height="640" fill="#FFFFFF"/>
  <text x="54" y="58" class="heading ink">From evidence candidates to an inspectable Model Card</text>
  <rect x="1238" y="27" width="308" height="42" rx="21" fill="#EDF3FB" stroke="#9EB9DC"/>
  <text x="1392" y="53" text-anchor="middle" class="chip blue">CURRENT PUBLIC CORE · OFFLINE</text>

  <!-- pipeline arrows -->
  <path d="M357 282 H397 V270 L421 290 L397 310 V298 H357 Z" fill="#3D7BC8"/>
  <path d="M744 282 H784 V270 L808 290 L784 310 V298 H744 Z" fill="#3D7BC8"/>
  <path d="M1131 282 H1171 V270 L1195 290 L1171 310 V298 H1131 Z" fill="#3D7BC8"/>

  <!-- stage 1 -->
  <g transform="translate(54 104)">
    <rect width="300" height="372" rx="8" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="2"/>
    <circle cx="32" cy="32" r="18" fill="#1F4E9C"/>
    <text x="32" y="39" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">1</text>
    <text x="60" y="40" class="stage ink">Fix the target</text>

    <g transform="translate(91 78)" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round">
      <rect x="0" y="12" width="76" height="88" rx="5" fill="#FFFFFF"/>
      <path d="M52 12 V36 H76"/>
      <rect x="40" y="0" width="76" height="88" rx="5" fill="#FFFFFF"/>
      <path d="M92 0 V24 H116"/>
      <path d="M56 43 H99 M56 58 H99 M56 73 H86" stroke-width="3"/>
    </g>

    <text x="28" y="215" class="body ink">namespace/model</text>
    <text x="28" y="246" class="body ink">resolved 40-char revision</text>
    <text x="28" y="277" class="body ink">typed source roles</text>
    <text x="28" y="308" class="body ink">prepared source content</text>
    <rect x="28" y="329" width="174" height="25" rx="4" fill="#F7EDEF"/>
    <text x="115" y="347" text-anchor="middle" class="label carmine">MANUAL INPUT TODAY</text>
  </g>

  <!-- stage 2 -->
  <g transform="translate(441 104)">
    <rect width="300" height="372" rx="8" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="2"/>
    <circle cx="32" cy="32" r="18" fill="#1F4E9C"/>
    <text x="32" y="39" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">2</text>
    <text x="60" y="40" class="stage ink">Bind evidence</text>

    <g transform="translate(67 80)" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round">
      <path d="M34 42 H88"/>
      <path d="M112 42 H166"/>
      <circle cx="20" cy="42" r="14" fill="#FFFFFF"/>
      <circle cx="100" cy="42" r="14" fill="#FFFFFF"/>
      <circle cx="180" cy="42" r="14" fill="#FFFFFF"/>
      <path d="M86 104 H114" stroke="#B2182B"/>
      <path d="M94 94 L84 104 L94 114 M106 94 L116 104 L106 114" stroke="#B2182B"/>
    </g>

    <text x="28" y="215" class="body ink">quote → normalized offsets</text>
    <text x="28" y="246" class="body ink">pointer → exact fragment</text>
    <text x="28" y="277" class="body ink">revision + SHA-256</text>
    <text x="28" y="308" class="body ink">stable binding ID</text>
    <rect x="28" y="329" width="217" height="25" rx="4" fill="#EDF3FB"/>
    <text x="136" y="347" text-anchor="middle" class="label blue">COORDINATE VERIFIED</text>
  </g>

  <!-- stage 3 -->
  <g transform="translate(828 104)">
    <rect width="300" height="372" rx="8" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="2"/>
    <circle cx="32" cy="32" r="18" fill="#1F4E9C"/>
    <text x="32" y="39" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">3</text>
    <text x="60" y="40" class="stage ink">Apply policy</text>

    <g transform="translate(47 78)">
      <path d="M103 0 V33 M103 33 H35 V58 M103 33 H103 V58 M103 33 H171 V58" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="103" cy="0" r="11" fill="#1F4E9C"/>
      <circle cx="35" cy="72" r="14" fill="#278447"/>
      <path d="M28 72 L33 78 L43 65" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="103" cy="72" r="14" fill="#C47D09"/>
      <path d="M96 72 H110" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="171" cy="72" r="14" fill="#B2182B"/>
      <path d="M165 66 L177 78 M177 66 L165 78" stroke="#FFFFFF" stroke-width="3"/>
      <text x="35" y="105" text-anchor="middle" class="small ink">accepted</text>
      <text x="103" y="105" text-anchor="middle" class="small ink">withheld</text>
      <text x="171" y="105" text-anchor="middle" class="small ink">rejected</text>
    </g>

    <text x="28" y="232" class="body ink">field × role × relation</text>
    <text x="28" y="263" class="body ink">target and revision scope</text>
    <text x="28" y="294" class="body ink">accepted → card projection</text>
    <text x="28" y="325" class="body ink">all bindings → ledger</text>
    <text x="28" y="350" class="small carmine">conflict → Not specified</text>
  </g>

  <!-- stage 4 -->
  <g transform="translate(1215 104)">
    <rect width="331" height="372" rx="8" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="2"/>
    <circle cx="32" cy="32" r="18" fill="#1F4E9C"/>
    <text x="32" y="39" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">4</text>
    <text x="60" y="40" class="stage ink">Inspect artifact</text>

    <g transform="translate(82 73)">
      <rect x="0" y="0" width="168" height="120" rx="4" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"/>
      <rect x="17" y="18" width="60" height="13" fill="#1F4E9C"/>
      <path d="M17 49 H151 M17 68 H151 M17 87 H151 M17 106 H108" stroke="#A7ADB4" stroke-width="3"/>
      <circle cx="139" cy="102" r="24" fill="#FFFFFF" stroke="#B2182B" stroke-width="4"/>
      <path d="M156 120 L172 136" stroke="#B2182B" stroke-width="6" stroke-linecap="round"/>
    </g>

    <text x="28" y="232" class="body ink">38-field schema v5</text>
    <text x="28" y="263" class="body ink">field-level evidence ledger</text>
    <text x="28" y="294" class="body ink">append-only review history</text>
    <text x="28" y="325" class="body ink">deterministic JSON</text>
    <text x="28" y="350" class="body ink">self-contained static HTML</text>
  </g>

  <!-- status band -->
  <rect x="54" y="520" width="1492" height="80" rx="6" fill="#F6F6F6" stroke="#D9D9D9"/>
  <rect x="54" y="520" width="9" height="80" rx="4" fill="#B2182B"/>
  <text x="89" y="552" class="label carmine">NOT AUTOMATED YET</text>
  <text x="89" y="580" class="body ink">source collection</text>
  <circle cx="291" cy="574" r="3" fill="#6E6E6E"/>
  <text x="318" y="580" class="body ink">candidate extraction</text>
  <circle cx="543" cy="574" r="3" fill="#6E6E6E"/>
  <text x="570" y="580" class="body ink">semantic claim-support checking</text>
  <text x="1509" y="580" text-anchor="end" class="small muted">These stages belong before publication use.</text>
</svg>
