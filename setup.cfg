[metadata]
name = evaleval-model-cards
version = 0.2.0
description = Evidence-backed JSON Model Cards with deterministic Markdown companions
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files =
    LICENSE
    NOTICE.md

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires =
    huggingface-hub>=0.32
    jsonschema>=4.18,<5
    pydantic>=2.11
    PyYAML>=6.0

[options.extras_require]
# The generator half. It reads the Auto-BenchmarkCard composer as a library, at the
# commit recorded in composer-pin.json; the bridge refuses any other commit unless the
# caller passes --allow-unpinned, so a card can always say which composer wrote it.
generate =
    auto_benchmarkcard @ git+https://github.com/evaleval/auto-benchmarkcard.git@fd2dc11e86e4de16d3438734813397a06a5517e1

[options.packages.find]
where = src
include = model_cards*
exclude = tests*

[options.package_data]
model_cards =
    resources/*.json

[options.entry_points]
console_scripts =
    modelcards = model_cards.core.cli:main
