[metadata]
name = evaleval-model-cards
version = 0.1.0
description = Evidence-backed JSON Model Cards
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files =
    LICENSE
    NOTICE.md

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = False

[options.packages.find]
where = src
include = model_cards*
exclude = tests*

[options.entry_points]
console_scripts =
    model-cards = model_cards.cli:main
